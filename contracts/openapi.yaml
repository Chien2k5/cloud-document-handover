"openapi": "3.0.3"
"info":
  "title": "Group 5 Document Handover API"
  "version": "0.5.0-backend-integration"
  "description": "Backend auth, projects, upload, checksum reconciliation and handover are implemented. The local AWS SDK adapter is opt-in through UPLOAD_S3_ENABLED; AWS execution remains unverified. Every FileVersion response includes its persistent uploadId so an authorized project member can recover polling through the existing upload-state endpoint after reload. Draft creation requires AVAILABLE + VERIFIED; publishing rechecks integrity and exact object retrievability. PostgreSQL tests use a test-only storage fixture. API timestamps use UTC; authentication uses session cookies and CSRF. Lambda must write checksum schema v1 and the shared result key. Team integration approval is not implied."
"servers":
  -
    "url": "http://localhost:8080"
    "description": "Local development only; use HTTPS in shared/AWS environment"
"tags":
  -
    "name": "Implemented week 1"
  -
    "name": "Contract only"
"security":
  -
    "sessionCookie": []
"paths":
  "/api/v1/health":
    "get":
      "operationId": "health"
      "summary": "Database readiness"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "SELECT 1 against PostgreSQL. 200 UP; 503 DB_UNAVAILABLE if connection/query fails. No database identity or credentials in response."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Health"
        "503":
          "description": "Database unavailable (DB_UNAVAILABLE)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "406":
          "$ref": "#/components/responses/Error406"
      "security": []
  "/api/v1/auth/csrf":
    "get":
      "operationId": "csrf"
      "summary": "Get CSRF token"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Public masked CSRF token endpoint, including with disabled or expired prior sessions. No enabled-account lookup here. Keep the same cookie jar and fetch a fresh token after login/logout or session expiry. Protected endpoints still reject disabled accounts."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Csrf"
        "406":
          "$ref": "#/components/responses/Error406"
      "security": []
  "/api/v1/auth/register":
    "post":
      "operationId": "register"
      "summary": "Register an account without signing in"
      "x-implementation-status": "implemented"
      "description": "Public JSON registration with valid CSRF from GET /api/v1/auth/csrf and the same cookie jar. Send the token under the headerName returned by that endpoint (currently X-CSRF-TOKEN). Anonymous CSRF sessions are allowed. Does not authenticate, replace an existing principal, create projects or grant memberships. Returns only the committed public User view; email is trimmed and lowercased, displayName is stripped, passwords remain unchanged. Do not automatically retry POST after timeout or a lost response: creation may already have committed."
      "security": []
      "parameters":
        - {"name": "X-CSRF-TOKEN", "in": "header", "required": true, "description": "Current backend header name; obtain headerName and masked token dynamically from GET /api/v1/auth/csrf with the same cookies.", "schema": {"type": "string"}}
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegistrationRequest"
      "responses":
        "201":
          "description": "Account committed; session remains unchanged. Explicit login is required."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "description": "VALIDATION_ERROR: invalid fields, types, required body, unknown fields, byte limits or exact confirmation."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "description": "EMAIL_ALREADY_EXISTS: normalized email already belongs to an account, including a disabled account or concurrent registration."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "415":
          "$ref": "#/components/responses/Error415"
        "406":
          "$ref": "#/components/responses/Error406"
        "500":
          "description": "INTERNAL_ERROR: sanitized unexpected server or persistence failure; never assume an email conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/login":
    "post":
      "operationId": "login"
      "summary": "Login with form encoded credentials"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Uses Spring Security form authentication, NOT JSON. Returns HttpOnly JSESSIONID; session ID and CSRF token rotate on success. Invalid credentials return 401 INVALID_CREDENTIALS. Registration uses a separate JSON endpoint and does not sign in the new account."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/x-www-form-urlencoded":
            "schema":
              "$ref": "#/components/schemas/Login"
      "parameters":
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
  "/api/v1/auth/me":
    "get":
      "operationId": "me"
      "summary": "Current account"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Implemented. Re-check account enabled status from PostgreSQL on every request before protected handlers. Disabled/deleted accounts receive 401 ACCOUNT_DISABLED and session invalidation. Database lookup failure receives 503 AUTH_UNAVAILABLE, never permission by fallback."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Error401"
        "503":
          "$ref": "#/components/responses/Error503"
        "406":
          "$ref": "#/components/responses/Error406"
  "/api/v1/auth/logout":
