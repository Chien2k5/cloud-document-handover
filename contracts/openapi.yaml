      "description": "CONTRACT ONLY. Project Owner or named authenticated active recipient (inside/outside project). External recipient cannot list the whole project. Recipients can access only READY/CONFIRMED, unexpired, unrevoked packages."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Handover"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
      "parameters":
        -
          "name": "handoverId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v1/handovers/{handoverId}/publish":
    "post":
      "operationId": "publishHandover"
      "summary": "Owner publishes only verified exact versions"
      "tags":
        - "Contract only"
      "x-implementation-status": "contract-only"
      "description": "CONTRACT ONLY. Lock DRAFT; require nonempty items and recipients, future expiry, active access, every version belongs to project, AVAILABLE + VERIFIED and exact version still retrievable. Freeze manifest and recipients at READY. Repeat publish returns same manifest; source v2 never changes pinned v1. No body."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Handover"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
      "parameters":
        -
          "name": "handoverId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
  "/api/v1/handovers/{handoverId}/confirm":
    "post":
      "operationId": "confirmHandover"
      "summary": "Named recipient confirms after login"
      "tags":
        - "Contract only"
      "x-implementation-status": "contract-only"
      "description": "CONTRACT ONLY. Session actor must be an ACTIVE named recipient; package READY/CONFIRMED, future expiry and ACTIVE access required. Record own confirmedAt idempotently with server actor/time and audit. Response Confirmation.status means this recipient confirmed; aggregate Handover.status becomes CONFIRMED only when every ACTIVE named recipient confirms. Recipient UI policy requires Nam review."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Confirmation"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
      "parameters":
        -
          "name": "handoverId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
  "/api/v1/handovers/{handoverId}/items/{fileVersionId}/download":
    "get":
      "operationId": "downloadHandoverItem"
      "summary": "Download a pinned package item"
      "tags":
        - "Contract only"
      "x-implementation-status": "contract-only"
      "description": "CONTRACT ONLY. Owner or named active recipient; check package and recipient access and expiry before URL. Version must be in frozen manifest; never resolve latest. Cap TTL at min(300 seconds, remaining handover lifetime)."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Download"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
      "parameters":
        -
          "name": "handoverId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "fileVersionId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v1/handovers/{handoverId}/revoke":
    "post":
      "operationId": "revokeHandover"
      "summary": "Owner revokes access and new URLs"
      "tags":
        - "Contract only"
      "x-implementation-status": "contract-only"
      "description": "CONTRACT ONLY. Idempotently set accessStatus REVOKED; preserve workflow and confirmations and audit. Already issued S3 URLs may work until TTL expiry. No body."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Handover"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
      "parameters":
        -
          "name": "handoverId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
"components":
  "securitySchemes":
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "JSESSIONID"
      "description": "HttpOnly session cookie. State-changing operations also need X-CSRF-TOKEN, including login/logout."
  "schemas":
    "Error":
      "type": "object"
      "additionalProperties": false
      "required":
        - "code"
        - "message"
        - "requestId"
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
        "requestId":
          "type": "string"
          "format": "uuid"
    "Health":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "UP"
    "Csrf":
      "type": "object"
      "additionalProperties": false
      "required":
        - "headerName"
        - "token"
      "properties":
        "headerName":
          "type": "string"
          "example": "X-CSRF-TOKEN"
        "token":
          "type": "string"
    "User":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "email"
        - "displayName"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "email":
          "type": "string"
          "format": "email"
        "displayName":
          "type": "string"
    "Login":
      "type": "object"
      "additionalProperties": false
      "required":
        - "email"
        - "password"
      "properties":
        "email":
          "type": "string"
          "format": "email"
        "password":
          "type": "string"
          "format": "password"
    "CreateProject":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 150
          "pattern": ".*\\S.*"
        "description":
          "type": "string"
          "maxLength": 2000
          "default": ""
      "description": "name is a nonblank JSON string. description may be omitted (defaults to empty string), but explicit null, numbers, booleans, arrays and objects are rejected. Unknown fields are rejected."
    "Project":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "name"
        - "description"
        - "quotaBytes"
        - "usedBytes"
        - "reservedBytes"
        - "role"
        - "createdAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "description":
          "type": "string"
        "quotaBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "usedBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "reservedBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "role":
          "type": "string"
          "enum":
            - "OWNER"
            - "EDITOR"
            - "VIEWER"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "ProjectPage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "page"
        - "size"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Project"
        "page":
          "type": "integer"
          "minimum": 0
        "size":
          "type": "integer"
          "minimum": 1
          "maximum": 100
    "SetMember":
      "type": "object"
      "additionalProperties": false
      "required":
        - "role"
      "properties":
        "role":
          "type": "string"
          "enum":
            - "EDITOR"
            - "VIEWER"
    "Member":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
        - "displayName"
        - "role"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
        "displayName":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "OWNER"
            - "EDITOR"
            - "VIEWER"
    "UploadRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "filename"
        - "contentType"
        - "size"
        - "expectedSha256"
      "properties":
        "filename":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "contentType":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "size":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 104857600
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
        "fileId":
          "type": "string"
          "format": "uuid"
          "description": "Optional existing FileMetadata ID. Omit to create a new logical document. If present, it must belong to the path project and filename must equal its current metadata filename (no rename operation). Never identify an existing document by filename. Explicit null is invalid. Backend design; Nam/Dang review pending."
      "description": "Each init creates a new UploadSession and FileVersion, including when fileId is supplied. Same filename without fileId creates a distinct logical document. Init is not idempotent; after an ambiguous timeout a retry may reserve a second session until expiry. See phase-01 contract before integration."
    "PresignedUpload":
      "type": "object"
      "additionalProperties": false
      "required":
        - "method"
        - "url"
        - "headers"
        - "expiresAt"
      "properties":
        "method":
          "type": "string"
          "enum":
            - "PUT"
        "url":
          "type": "string"
          "format": "uri"
        "headers":
          "type": "object"
          "additionalProperties":
            "type": "string"
          "description": "Client must send every returned signed header exactly. Content-Type is required. Backend requires If-None-Match: * in the adapter signing response and fails closed without it. Actual signed conditional PUT, policy and CORS remain subject to Dang/Chien AWS POC; no single-use or physical byte quota guarantee is claimed."
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "UploadCreated":
      "type": "object"
      "additionalProperties": false
      "required":
        - "uploadId"
        - "fileId"
        - "fileVersionId"
        - "uploadStatus"
        - "integrityStatus"
        - "presignedUpload"
      "properties":
        "uploadId":
          "type": "string"
          "format": "uuid"
        "fileId":
          "type": "string"
          "format": "uuid"
        "fileVersionId":
          "type": "string"
          "format": "uuid"
        "uploadStatus":
          "$ref": "#/components/schemas/UploadStatus"
        "integrityStatus":
          "$ref": "#/components/schemas/IntegrityStatus"
        "presignedUpload":
          "$ref": "#/components/schemas/PresignedUpload"
    "UploadStatus":
      "type": "string"
      "enum":
        - "PENDING"
        - "AVAILABLE"
        - "FAILED"
        - "EXPIRED"
    "IntegrityStatus":
      "type": "string"
      "enum":
        - "INTEGRITY_PENDING"
        - "VERIFIED"
        - "MISMATCH"
        - "FAILED"
    "CompleteUpload":
      "type": "object"
      "additionalProperties": false
      "required":
        - "versionId"
      "properties":
        "versionId":
          "type": "string"
          "minLength": 1
          "description": "Exact opaque x-amz-version-id from S3 PUT. Must contain a non-whitespace character and cannot be literal null. Do not trim, decode again, normalize or substitute latest. Backend HEADs the server-owned bucket/key at this exact ID."
          "not":
            "enum":
              - "null"
          "pattern": "\\S"
    "FileVersion":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "fileId"
        - "filename"
        - "contentType"
        - "size"
        - "versionId"
        - "expectedSha256"
        - "actualSha256"
        - "uploadStatus"
        - "integrityStatus"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "fileId":
          "type": "string"
          "format": "uuid"
        "filename":
          "type": "string"
        "contentType":
          "type": "string"
        "size":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "versionId":
          "type": "string"
          "nullable": true
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
        "actualSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
          "nullable": true
        "uploadStatus":
          "$ref": "#/components/schemas/UploadStatus"
        "integrityStatus":
          "$ref": "#/components/schemas/IntegrityStatus"
      "description": "Identity bucket/objectKey/S3 Version ID is server-owned. After AVAILABLE it is immutable; a new version is a new row. AVAILABLE only means exact object was checked, not VERIFIED. actualSha256 is populated only by backend reconciliation of the matching Lambda result."
    "UploadState":
      "type": "object"
      "additionalProperties": false
      "required":
        - "uploadId"
        - "fileVersion"
        - "expiresAt"
      "properties":
        "uploadId":
          "type": "string"
          "format": "uuid"
        "fileVersion":
          "$ref": "#/components/schemas/FileVersion"
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "FilePage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "page"
        - "size"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FileVersion"
        "page":
          "type": "integer"
          "minimum": 0
        "size":
          "type": "integer"
          "minimum": 1
          "maximum": 100
    "Download":
      "type": "object"
      "additionalProperties": false
      "required":
        - "url"
        - "versionId"
        - "expiresAt"
      "properties":
        "url":
          "type": "string"
          "format": "uri"
        "versionId":
          "type": "string"
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "CreateHandover":
      "type": "object"
      "additionalProperties": false
      "required":
        - "title"
        - "fileVersionIds"
        - "recipientUserIds"
        - "expiresAt"
      "properties":
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "fileVersionIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
          "uniqueItems": true
        "recipientUserIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
          "uniqueItems": true
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "HandoverItem":
      "type": "object"
      "additionalProperties": false
      "required":
        - "fileVersionId"
        - "filename"
        - "versionId"
        - "expectedSha256"
      "properties":
        "fileVersionId":
          "type": "string"
          "format": "uuid"
        "filename":
          "type": "string"
        "versionId":
          "type": "string"
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
      "description": "Draft selection is limited to AVAILABLE versions with a fixed S3 identity; integrity may still be pending. Publish additionally requires VERIFIED and retrievable. Drafts cannot select a PENDING version with null versionId. Contract only; recipient/UI review pending."
    "HandoverRecipient":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
        - "accessStatus"
        - "confirmedAt"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
        "accessStatus":
          "type": "string"
          "enum":
            - "ACTIVE"
            - "REVOKED"
        "confirmedAt":
          "type": "string"
          "format": "date-time"
          "nullable": true
    "Handover":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "projectId"
        - "title"
        - "status"
        - "accessStatus"
        - "expiresAt"
        - "items"
        - "recipients"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "projectId":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
        "status":
          "type": "string"
          "enum":
            - "DRAFT"
            - "READY"
            - "CONFIRMED"
        "accessStatus":
          "type": "string"
          "enum":
            - "ACTIVE"
            - "REVOKED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/HandoverItem"
        "recipients":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/HandoverRecipient"
    "Confirmation":
      "type": "object"
      "additionalProperties": false
      "required":
        - "handoverId"
        - "userId"
        - "confirmedAt"
        - "status"
      "properties":
        "handoverId":
          "type": "string"
          "format": "uuid"
        "userId":
          "type": "string"
          "format": "uuid"
        "confirmedAt":
          "type": "string"
          "format": "date-time"
        "status":
          "type": "string"
          "enum":
            - "CONFIRMED"
          "description": "Status of this recipient acknowledgement, not the aggregate package. Fetch Handover.status to see whether all active named recipients have confirmed."
  "responses":
    "Error400":
      "description": "Invalid payload, UUID, pagination or unknown fields"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "VALIDATION_ERROR"
            "message": "Invalid payload, UUID, pagination or unknown fields"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error401":
      "description": "Missing/expired session (UNAUTHENTICATED), invalid login (INVALID_CREDENTIALS), or disabled/deleted account (ACCOUNT_DISABLED; session invalidated)."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "UNAUTHENTICATED"
            "message": "Missing or expired login session"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error403":
      "description": "Insufficient role or missing/invalid CSRF token"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "ACCESS_DENIED"
            "message": "Insufficient role or missing/invalid CSRF token"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error404":
      "description": "Missing resource or resource hidden from this caller"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "NOT_FOUND"
            "message": "Missing resource or resource hidden from this caller"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error409":
      "description": "Conflicting state, version, size, quota or immutable owner"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "STATE_CONFLICT"
            "message": "Conflicting state, version, size, quota or immutable owner"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error503":
      "description": "Dependency unavailable: AUTH_UNAVAILABLE for account lookup, DB_UNAVAILABLE for readiness, STORAGE_UNAVAILABLE for storage operations. No protected operation runs on failed account lookup."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "STORAGE_UNAVAILABLE"
            "message": "Storage dependency unavailable; no fabricated success"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error415":
      "description": "Unsupported Content-Type; JSON business requests require application/json"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "UNSUPPORTED_MEDIA_TYPE"
            "message": "Unsupported Content-Type; JSON business requests require application/json"
            "requestId": "10000000-0000-0000-0000-000000000099"
    "Error406":
      "description": "Requested response media type is not supported; API error envelope is JSON"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "NOT_ACCEPTABLE"
            "message": "Requested response media type is not supported; API error envelope is JSON"
            "requestId": "10000000-0000-0000-0000-000000000099"
"x-review-status":
  "backend": "Backend upload service implemented; real PostgreSQL plus test-only fake; AWS adapter and team review pending"
  "nam": "Pending API/UI and retry flow review; no approval claimed"
  "dang": "Pending adapter, checksum and conditional PUT POC; no approval claimed"
  "chien": "Pending bucket policy/CORS/IAM/limits/cleanup review; no approval claimed"
