      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Invalidate session and clear cookie; no enabled-account lookup, so disabled accounts can logout. Also allows anonymous logout with a valid CSRF token. Expired-session tokens receive 403; obtain a fresh public CSRF token and retry."
      "responses":
        "204":
          "description": "No content"
        "403":
          "$ref": "#/components/responses/Error403"
      "security": []
      "parameters":
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
