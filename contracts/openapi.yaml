"components":
  "securitySchemes":
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "JSESSIONID"
      "description": "HttpOnly session cookie. State-changing operations also need X-CSRF-TOKEN, including login/logout."
  "schemas":
    "Error":
      "type": "object"
      "additionalProperties": false
      "required":
        - "code"
        - "message"
        - "requestId"
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
        "requestId":
          "type": "string"
          "format": "uuid"
    "Health":
      "type": "object"
      "additionalProperties": false
      "required":
        - "status"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "UP"
    "Csrf":
      "type": "object"
      "additionalProperties": false
      "required":
        - "headerName"
        - "token"
      "properties":
        "headerName":
          "type": "string"
          "example": "X-CSRF-TOKEN"
        "token":
          "type": "string"
    "User":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "email"
        - "displayName"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "email":
          "type": "string"
          "format": "email"
        "displayName":
          "type": "string"
    "RegistrationRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "displayName"
        - "email"
        - "password"
        - "confirmPassword"
      "description": "Exactly four non-null JSON strings; blank Unicode whitespace is rejected. Backend validation remains authoritative. Name limit is measured after Java String.strip(), email length in UTF-16 code units before trim and after normalization, and password length in Unicode code points and UTF-8 bytes. No password transformations."
      "properties":
        "displayName":
          "type": "string"
          "minLength": 1
          "x-stripped-maxLength": 100
          "description": "Nonblank; at most 100 Unicode code points after String.strip(). Raw maxLength is intentionally absent because leading/trailing whitespace does not count toward this backend limit."
        "email":
          "type": "string"
          "format": "email"
          "minLength": 1
          "maxLength": 254
          "x-max-utf16-code-units": 254
          "description": "Valid email after trim(); raw input and normalized trim().toLowerCase(Locale.ROOT) are each limited to 254 UTF-16 code units."
        "password":
          "type": "string"
          "format": "password"
          "writeOnly": true
          "minLength": 8
          "x-max-utf8-bytes": 72
          "description": "Nonblank; at least 8 Unicode code points and at most 72 UTF-8 bytes, including spaces. Never trim, lowercase, normalize or truncate. A 72-character maxLength would not express this byte limit."
        "confirmPassword":
          "type": "string"
          "format": "password"
          "writeOnly": true
          "minLength": 8
          "x-max-utf8-bytes": 72
          "x-exact-match": "password"
          "description": "Must match password exactly, without any transformations; therefore shares its code point and UTF-8 byte limits."
    "Login":
      "type": "object"
      "additionalProperties": false
      "required":
        - "email"
        - "password"
      "properties":
        "email":
          "type": "string"
          "format": "email"
        "password":
          "type": "string"
          "format": "password"
    "CreateProject":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 150
          "pattern": ".*\\S.*"
        "description":
          "type": "string"
          "maxLength": 2000
          "default": ""
      "description": "name is a nonblank JSON string. description may be omitted (defaults to empty string), but explicit null, numbers, booleans, arrays and objects are rejected. Unknown fields are rejected."
    "Project":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "name"
        - "description"
        - "quotaBytes"
        - "usedBytes"
        - "reservedBytes"
        - "role"
        - "createdAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "description":
          "type": "string"
        "quotaBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "usedBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "reservedBytes":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "role":
          "type": "string"
          "enum":
            - "OWNER"
            - "EDITOR"
            - "VIEWER"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "ProjectPage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "page"
        - "size"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Project"
        "page":
          "type": "integer"
          "minimum": 0
        "size":
          "type": "integer"
          "minimum": 1
          "maximum": 100
    "SetMember":
      "type": "object"
      "additionalProperties": false
      "required":
        - "role"
      "properties":
        "role":
          "type": "string"
          "enum":
            - "EDITOR"
            - "VIEWER"
    "Member":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
        - "displayName"
        - "role"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
        "displayName":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "OWNER"
            - "EDITOR"
            - "VIEWER"
    "UploadRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "filename"
        - "contentType"
        - "size"
        - "expectedSha256"
      "properties":
        "filename":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "contentType":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "size":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 104857600
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
        "fileId":
          "type": "string"
          "format": "uuid"
          "description": "Optional existing FileMetadata ID. Omit to create a new logical document. If present, it must belong to the path project and filename must equal its current metadata filename (no rename operation). Never identify an existing document by filename. Explicit null is invalid. Backend design; Nam/Dang review pending."
      "description": "Each init creates a new UploadSession and FileVersion, including when fileId is supplied. Same filename without fileId creates a distinct logical document. Init is not idempotent; after an ambiguous timeout a retry may reserve a second session until expiry. See phase-01 contract before integration."
    "PresignedUpload":
      "type": "object"
      "additionalProperties": false
      "required":
        - "method"
        - "url"
        - "headers"
        - "expiresAt"
      "properties":
        "method":
          "type": "string"
          "enum":
            - "PUT"
        "url":
          "type": "string"
          "format": "uri"
        "headers":
          "type": "object"
          "additionalProperties":
            "type": "string"
          "description": "Client must send every returned signed header exactly. Content-Type is required. Backend requires If-None-Match: * in the adapter signing response and fails closed without it. Actual signed conditional PUT, policy and CORS remain subject to Dang/Chien AWS POC; no single-use or physical byte quota guarantee is claimed."
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "UploadCreated":
      "type": "object"
      "additionalProperties": false
      "required":
        - "uploadId"
        - "fileId"
        - "fileVersionId"
        - "uploadStatus"
        - "integrityStatus"
        - "presignedUpload"
      "properties":
        "uploadId":
          "type": "string"
          "format": "uuid"
        "fileId":
          "type": "string"
          "format": "uuid"
        "fileVersionId":
          "type": "string"
          "format": "uuid"
        "uploadStatus":
          "$ref": "#/components/schemas/UploadStatus"
        "integrityStatus":
          "$ref": "#/components/schemas/IntegrityStatus"
        "presignedUpload":
          "$ref": "#/components/schemas/PresignedUpload"
    "UploadStatus":
      "type": "string"
      "enum":
        - "PENDING"
        - "AVAILABLE"
        - "FAILED"
        - "EXPIRED"
    "IntegrityStatus":
      "type": "string"
      "enum":
        - "INTEGRITY_PENDING"
        - "VERIFIED"
        - "MISMATCH"
        - "FAILED"
    "CompleteUpload":
      "type": "object"
      "additionalProperties": false
      "required":
        - "versionId"
      "properties":
        "versionId":
          "type": "string"
          "minLength": 1
          "description": "Exact opaque x-amz-version-id from S3 PUT. Must contain a non-whitespace character and cannot be literal null. Do not trim, decode again, normalize or substitute latest. Backend HEADs the server-owned bucket/key at this exact ID."
          "not":
            "enum":
              - "null"
          "pattern": "\\S"
    "FileVersion":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "uploadId"
        - "fileId"
        - "filename"
        - "contentType"
        - "size"
        - "versionId"
        - "expectedSha256"
        - "actualSha256"
        - "uploadStatus"
        - "integrityStatus"
      "properties":
        "uploadId":
          "type": "string"
          "format": "uuid"
          "description": "Persistent UploadSession ID for this exact FileVersion. Use the existing project-scoped upload-state endpoint to resume checksum polling after reload; never substitute this value for S3 Version ID."
        "id":
          "type": "string"
          "format": "uuid"
        "fileId":
          "type": "string"
          "format": "uuid"
        "filename":
          "type": "string"
        "contentType":
          "type": "string"
        "size":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "versionId":
          "type": "string"
          "nullable": true
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
        "actualSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
          "nullable": true
        "uploadStatus":
          "$ref": "#/components/schemas/UploadStatus"
        "integrityStatus":
          "$ref": "#/components/schemas/IntegrityStatus"
      "description": "Identity bucket/objectKey/S3 Version ID is server-owned. After AVAILABLE it is immutable; a new version is a new row. AVAILABLE only means exact object was checked, not VERIFIED. actualSha256 is populated only by backend reconciliation of the matching Lambda result."
    "UploadState":
      "type": "object"
      "additionalProperties": false
      "required":
        - "uploadId"
        - "fileVersion"
        - "expiresAt"
      "properties":
        "uploadId":
          "type": "string"
          "format": "uuid"
        "fileVersion":
          "$ref": "#/components/schemas/FileVersion"
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "FilePage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "page"
        - "size"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FileVersion"
        "page":
          "type": "integer"
          "minimum": 0
        "size":
          "type": "integer"
          "minimum": 1
          "maximum": 100
    "Download":
      "type": "object"
      "additionalProperties": false
      "required":
        - "url"
        - "versionId"
        - "expiresAt"
      "properties":
        "url":
          "type": "string"
          "format": "uri"
        "versionId":
          "type": "string"
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "CreateHandover":
      "type": "object"
      "additionalProperties": false
      "required":
        - "title"
        - "fileVersionIds"
        - "recipientUserIds"
        - "expiresAt"
      "properties":
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "fileVersionIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
          "uniqueItems": true
        "recipientUserIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
          "uniqueItems": true
        "expiresAt":
          "type": "string"
          "format": "date-time"
    "HandoverItem":
      "type": "object"
      "additionalProperties": false
      "required":
        - "fileVersionId"
        - "filename"
        - "versionId"
        - "expectedSha256"
      "properties":
        "fileVersionId":
          "type": "string"
          "format": "uuid"
        "filename":
          "type": "string"
        "versionId":
          "type": "string"
        "expectedSha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
          "minLength": 64
          "maxLength": 64
      "description": "Draft selection requires AVAILABLE + VERIFIED and a fixed S3 identity. Publish rechecks both states and exact object retrievability. PENDING uploads, failed or mismatched integrity, and foreign-project versions cannot enter the manifest. Published items keep their pinned FileVersion; no latest substitution."
    "HandoverRecipient":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
        - "accessStatus"
        - "confirmedAt"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
        "accessStatus":
          "type": "string"
          "enum":
            - "ACTIVE"
            - "REVOKED"
        "confirmedAt":
          "type": "string"
          "format": "date-time"
          "nullable": true
    "Handover":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "projectId"
