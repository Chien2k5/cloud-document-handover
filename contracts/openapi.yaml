  "/api/v1/projects/{id}/files/uploads":
    "post":
      "operationId": "initUpload"
      "summary": "Reserve quota and request a presigned PUT"
      "tags":
        - "Implemented week 2"
      "x-implementation-status": "implemented"
      "description": "Implemented backend; real AWS adapter/integration pending. Owner/Editor; omit fileId for a new document, supply a project-owned fileId for a new version. Each init uses fresh uploadId/fileVersionId and server key uploads/{projectId}/{uploadId}. Same filename is not identity. Reserve requested size under project lock; reject over size/quota. Init retry is not idempotent and creates another reservation; client must not blindly retry. Return PENDING + INTEGRITY_PENDING. Write-once S3 PUT/physical storage accounting is an unresolved external review gate; no AWS integration approval is claimed."
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadCreated"
        "400":
