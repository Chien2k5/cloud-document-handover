          "schema":
            "type": "string"
  "/api/v1/projects/{id}/files/uploads/{uploadId}/complete":
    "post":
      "operationId": "completeUpload"
      "summary": "Validate the uploaded S3 version"
      "tags":
        - "Implemented week 2"
      "x-implementation-status": "implemented"
      "description": "Implemented backend with an opt-in AWS SDK adapter; AWS integration unverified. Initiating user must still be Owner/Editor. Lock project then upload/version; if already AVAILABLE, same version returns the persisted state (including integrity), even after session expiry, with no HEAD/reset/quota transfer; different version is 409 UPLOAD_ALREADY_COMPLETED. For PENDING, expiry is checked before completion: expired -> EXPIRED, release quota once, 409 UPLOAD_EXPIRED. HEAD exact server-owned bucket/key + claimed version; missing object -> 409 OBJECT_NOT_READY, keep reservation until expiry; storage error -> 503; wrong size/type -> FAILED, release once, 409 UPLOAD_OBJECT_INVALID. Re-check PENDING/expiry after HEAD under the same lock order before commit. Only successful HEAD sets AVAILABLE and moves reserved to used once; integrity remains INTEGRITY_PENDING. Never trust client hash/status or ETag; no latest lookup."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadState"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
        "406":
          "$ref": "#/components/responses/Error406"
        "415":
          "$ref": "#/components/responses/Error415"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CompleteUpload"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "uploadId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
  "/api/v1/projects/{id}/files/uploads/{uploadId}":
    "get":
      "operationId": "uploadState"
      "summary": "Observe upload and independent integrity state"
      "tags":
        - "Implemented week 2"
      "x-implementation-status": "implemented"
      "description": "Implemented backend with an opt-in AWS SDK adapter; AWS integration unverified. Current project membership required. Reconcile only AVAILABLE versions. Match checksum schema and exact bucket/key/version/size against stored identity and compare actual vs stored expected SHA-256. Missing JSON keeps INTEGRITY_PENDING; malformed/mismatched/FAILED result sets integrity FAILED, never VERIFIED. FAILED may re-read on a later bounded poll; VERIFIED/MISMATCH are terminal for this immutable version. Concurrent polls use conditional update and never downgrade a valid terminal result. No client-supplied actual hash or VERIFIED status; suggested UI polling bounds require Nam review."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadState"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "503":
          "$ref": "#/components/responses/Error503"
        "406":
          "$ref": "#/components/responses/Error406"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "uploadId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v1/projects/{id}/files":
    "get":
      "operationId": "listFiles"
      "summary": "List file versions visible in this project"
      "tags":
        - "Implemented week 2"
      "x-implementation-status": "implemented"
      "description": "Implemented backend with an opt-in AWS SDK adapter; AWS integration unverified. Return project-scoped FileVersion records with fileId as logical document ID and persistent uploadId, one item per version, ordered by created_at then id. Recover polling after reload using GET /api/v1/projects/{id}/files/uploads/{uploadId} for AVAILABLE versions with INTEGRITY_PENDING or FAILED. List reads stored state and does not perform S3 I/O. PENDING uploads must not be completed by guessing latest or treating uploadId as an S3 Version ID. Same filename can belong to different fileIds. Page/size and current membership checks are retained; a session ID does not grant access."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FilePage"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
        "406":
          "$ref": "#/components/responses/Error406"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "page"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 0
            "default": 0
        -
          "name": "size"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
  "/api/v1/projects/{id}/files/{fileVersionId}/download":
    "get":
      "operationId": "downloadFile"
      "summary": "Issue a short lived URL for an exact version"
      "tags":
        - "Implemented week 2"
      "x-implementation-status": "implemented"
      "description": "Implemented backend with an opt-in AWS SDK adapter; AWS integration unverified. Check enabled session and current membership on the version project; require AVAILABLE + VERIFIED and exact object retrievable. Issue URL for server-owned bucket/key/version, never latest. TTL <= 300 seconds is proposed pending Dang/Chien measurement. Do not log URLs."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Download"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
