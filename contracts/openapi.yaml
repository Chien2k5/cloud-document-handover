"openapi": "3.0.3"
"info":
  "title": "Group 5 Document Handover API"
  "version": "0.3.0-week2-backend"
  "description": "Week 2 backend: auth, projects, upload sessions, quota, complete, integrity reconciliation, list and download are implemented. StoragePort has no real AWS adapter in this branch: unconfigured storage returns 503. Tests use a test-only fake plus real PostgreSQL; AWS integration is NOT RUN. Handover remains CONTRACT ONLY. Nam/Dang/Chien approval and AWS POC are NOT recorded. Session-cookie auth with CSRF; UTC timestamps. See docs/week-02/phase-01-upload-contract.md for decisions, review gates, state transitions and compatibility."
"servers":
  -
    "url": "http://localhost:8080"
    "description": "Local development only; use HTTPS in shared/AWS environment"
"tags":
  -
    "name": "Implemented week 1"
  -
    "name": "Contract only"
"security":
  -
    "sessionCookie": []
"paths":
  "/api/v1/health":
    "get":
      "operationId": "health"
      "summary": "Database readiness"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "SELECT 1 against PostgreSQL. 200 UP; 503 DB_UNAVAILABLE if connection/query fails. No database identity or credentials in response."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Health"
        "503":
          "description": "Database unavailable (DB_UNAVAILABLE)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "406":
          "$ref": "#/components/responses/Error406"
      "security": []
  "/api/v1/auth/csrf":
    "get":
      "operationId": "csrf"
      "summary": "Get CSRF token"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Public masked CSRF token endpoint, including with disabled or expired prior sessions. No enabled-account lookup here. Keep the same cookie jar and fetch a fresh token after login/logout or session expiry. Protected endpoints still reject disabled accounts."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Csrf"
        "406":
          "$ref": "#/components/responses/Error406"
      "security": []
  "/api/v1/auth/login":
    "post":
      "operationId": "login"
      "summary": "Login with form encoded credentials"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Uses Spring Security form authentication, NOT JSON. Returns HttpOnly JSESSIONID; session ID and CSRF token rotate on success. Invalid credentials return 401 INVALID_CREDENTIALS. No registration endpoint in week 1."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/x-www-form-urlencoded":
            "schema":
              "$ref": "#/components/schemas/Login"
      "parameters":
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
  "/api/v1/auth/me":
    "get":
      "operationId": "me"
      "summary": "Current account"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Implemented. Re-check account enabled status from PostgreSQL on every request before protected handlers. Disabled/deleted accounts receive 401 ACCOUNT_DISABLED and session invalidation. Database lookup failure receives 503 AUTH_UNAVAILABLE, never permission by fallback."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Error401"
        "503":
          "$ref": "#/components/responses/Error503"
        "406":
          "$ref": "#/components/responses/Error406"
  "/api/v1/auth/logout":
    "post":
      "operationId": "logout"
      "summary": "Invalidate session"
      "tags":
        - "Implemented week 1"
      "x-implementation-status": "implemented"
      "description": "Invalidate session and clear cookie; no enabled-account lookup, so disabled accounts can logout. Also allows anonymous logout with a valid CSRF token. Expired-session tokens receive 403; obtain a fresh public CSRF token and retry."
      "responses":
        "204":
          "description": "No content"
        "403":
          "$ref": "#/components/responses/Error403"
      "security": []
      "parameters":
        -
          "name": "X-CSRF-TOKEN"
          "in": "header"
          "required": true
          "description": "Obtain masked token from GET /auth/csrf with the same cookie jar. Fetch a fresh token after login/logout."
          "schema":
            "type": "string"
