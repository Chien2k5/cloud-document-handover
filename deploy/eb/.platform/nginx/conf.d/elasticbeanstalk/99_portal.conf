# TV1 (A04): Elastic Beanstalk AL2023 Nginx server-block extension.
# EB includes every *.conf in conf.d/elasticbeanstalk/ inside its default server {}.
# The default server already proxies "location /" to the Java app on port 5000,
# so /api/v1/** reaches Spring Boot without extra config here.
# React (built with --base=/portal/) is served statically by Nginx, never by Spring Security.

client_max_body_size 1m;   # file bytes go browser -> S3 directly; API bodies are small JSON

location = / {
    return 302 /portal/;
}

location = /portal {
    return 302 /portal/;
}

location /portal/ {
    alias /var/app/current/frontend/dist/;
    index index.html;
    # index.html must not be cached so a redeploy is picked up immediately;
    # hashed assets under /portal/assets/ are immutable.
    location = /portal/index.html {
        alias /var/app/current/frontend/dist/index.html;
        add_header Cache-Control "no-store" always;
    }
    location /portal/assets/ {
        alias /var/app/current/frontend/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
