# Local emulation of the Elastic Beanstalk AL2023 default Nginx server block.
# It includes the SAME deploy/eb/.platform/... extension that is shipped to EB,
# so the /portal/ static routing is tested before going to AWS.
upstream springboot {
    server host.docker.internal:5000;
    keepalive 16;
}

server {
    listen 80 default_server;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        proxy_pass          http://springboot;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    include /etc/nginx/eb-extensions/*.conf;
}
